name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B -DskipTests install

      # XIVToolHub はこの triggevent-jp-win.zip を取得してインストールする
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "launcher/target/triggevent-jp-win.zip" `
            --title "Triggevent JP ${{ github.ref_name }}" --notes "Triggevent JP ${{ github.ref_name }}"
