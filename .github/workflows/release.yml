name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B -DskipTests install

      # XIVToolHub はこの triggevent-plus-win.zip を取得してインストールする。
      # 名前を変える前の XIVToolHub は triggevent-jp-win.zip を探すので、同じものを旧名でも添付する
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item "launcher/target/triggevent-plus-win.zip" "launcher/target/triggevent-jp-win.zip"
          gh release create "${{ github.ref_name }}" "launcher/target/triggevent-plus-win.zip" "launcher/target/triggevent-jp-win.zip" `
            --title "Triggevent Plus ${{ github.ref_name }}" --notes "Triggevent Plus ${{ github.ref_name }}"
